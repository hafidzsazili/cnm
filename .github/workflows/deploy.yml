name: Deploy Cinemind to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Mengatur izin untuk GITHUB_TOKEN agar dapat melakukan publikasi ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah eksekusi deployment ganda yang tumpang tindih
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite SPA
        env:
          # Variabel API backend yang disuntikkan saat proses build Vite
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm run build
          # Pastikan file .nojekyll ada agar GitHub Pages tidak memproses Jekyll (mencegah error routing & asset)
          touch dist/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
